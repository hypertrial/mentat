name: Profile Docker runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/profile-docker-runner.yml
      - scripts/profile_runtime.py

permissions:
  contents: read

jobs:
  profile:
    name: Profile Docker runner verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.13'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Create quickstart repository and pull its image
        run: |
          set -eu
          sh examples/quickstart/create.sh "$RUNNER_TEMP/quickstart"
          image=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["docker_image"])' "$RUNNER_TEMP/quickstart/.mentat/contract.json")
          docker context create mentat --docker 'host=unix:///var/run/docker.sock'
          docker --context mentat pull "$image"
          mkdir -m 700 "$RUNNER_TEMP/mentat-state" "$RUNNER_TEMP/profile"
      - name: Check Docker runner and approve the contract
        run: |
          set -eu
          repo="$RUNNER_TEMP/quickstart"
          base=$(git -C "$repo" rev-parse mentat-demo-base)
          mentat() { uv run --locked --no-sync mentat --state "$RUNNER_TEMP/mentat-state" --docker-context mentat "$@"; }
          mentat doctor --repo "$repo" --base "$base" --runner docker
          digest=$(mentat spec check --repo "$repo" --base "$base" --runner docker --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["contract_digest"])')
          mentat spec approve "$digest" --repo "$repo" --base "$base" --runner docker --trusted-chat-approval
      - name: Profile verification on the Docker runner
        run: |
          set -eu
          repo="$RUNNER_TEMP/quickstart"
          base=$(git -C "$repo" rev-parse mentat-demo-base)
          fixed=$(git -C "$repo" rev-parse mentat-demo-fixed)
          MENTAT_PROFILE_TRACE="$RUNNER_TEMP/profile/trace.jsonl" \
            uv run --locked --no-sync python scripts/profile_runtime.py -- \
            --state "$RUNNER_TEMP/mentat-state" --docker-context mentat \
            verify --repo "$repo" --base "$base" --rev "$fixed" --runner docker --json
      - name: Summarize profile
        run: |
          python3 - "$RUNNER_TEMP/profile/trace.jsonl" <<'PY'
          import collections
          import json
          import statistics
          import sys

          durations = collections.defaultdict(list)
          with open(sys.argv[1], encoding="utf-8") as trace:
              for line in trace:
                  event = json.loads(line)
                  durations[event["phase"]].append(event["elapsed_seconds"])
          if not durations:
              sys.exit("profile trace has no events")
          print("Timings are inclusive; nested phases overlap their parents.")
          print(f"{'phase':<28}{'count':>6}{'total_s':>10}{'median_s':>10}")
          for phase in sorted(durations):
              values = durations[phase]
              print(f"{phase:<28}{len(values):>6}{sum(values):>10.3f}{statistics.median(values):>10.3f}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-runner-profile
          path: ${{ runner.temp }}/profile/trace.jsonl
          if-no-files-found: warn
