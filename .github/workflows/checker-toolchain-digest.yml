name: Checker toolchain digest

# Prints the tree digest of the pinned Lean checker toolchain on each supported
# architecture. Run it when the checker version changes, then copy the values
# into TOOLCHAIN_SHA256 in src/mentat/proof_checker.py.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/checker-toolchain-digest.yml
      - scripts/install-proof-checker

permissions:
  contents: read

jobs:
  digest:
    name: Toolchain digest (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and print its digest
        run: |
          bash scripts/install-proof-checker
          PYTHONPATH=src python3 -I -c 'import platform, sys; sys.path.insert(0, "src"); from mentat import proof_checker; print(platform.machine(), proof_checker._toolchain_digest())'
