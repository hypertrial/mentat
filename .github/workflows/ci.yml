name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Mentat checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.13'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Run core checks
        env:
          MENTAT_REQUIRE_PROOF_CHECKER: '1'
        run: |
          bash scripts/install-proof-checker
          uv sync --locked --extra polaris
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync mentat claims check --repo . --base "$(git rev-parse HEAD)"
          uv run --locked --no-sync pytest -q -rs
