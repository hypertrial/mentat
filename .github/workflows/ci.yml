name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Mentat checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.13'
          enable-cache: false
      # The full suite runs locally before every push (scripts/verify) and on Linux and macOS in
      # the Release verification workflow. This job runs only what a macOS workstation cannot:
      # the real Linux proof checker, plus the fast static checks.
      - name: Run Linux-only checks
        env:
          MENTAT_REQUIRE_PROOF_CHECKER: '1'
        run: |
          bash scripts/install-proof-checker --ci-profile
          uv sync --locked
          scripts/verify-fast
          uv run --locked --no-sync pytest -q -rs tests/test_proof_checker.py
