[project]
name = "mentat"
version = "0.2.0"
description = "Verify Git commits against approved project contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "rich>=14,<16",
    "typer>=0.20,<1",
    "z3-solver>=4.15,<5",
]

[project.optional-dependencies]
polaris = ["pyyaml>=6.0.3,<7"]

[project.scripts]
mentat = "mentat.cli:app"

[dependency-groups]
dev = ["hypothesis>=6,<7", "pytest>=9,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
